[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "si_qfi"
version = "0.1.0.dev0"
description = "Bridges SignalIntegrity drive-chain simulation with QuTiP gate fidelity analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Assumpcao" }]
keywords = [
    "quantum-computing",
    "signal-integrity",
    "qutip",
    "gate-fidelity",
    "microwave",
    "rf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# QuTiP and SignalIntegrity are optional so a bare install stays lightweight.
# Note SignalIntegrity is GPLv3+; it is not bundled here, only depended on.
quantum = ["qutip>=5.0"]
qubits = ["scqubits>=4.0"]
si = ["SignalIntegrity"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
# Only the importable package; tests/, examples/, notebooks/ and
# demo_prompts/ have no __init__.py and are deliberately not shipped.
include = ["si_qfi*"]

[tool.pytest.ini_options]
testpaths = ["si_qfi/tests"]
